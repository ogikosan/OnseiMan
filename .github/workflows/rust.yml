name: Rust CI & Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            suffix: windows-x64
            ext: .exe
          - name: macOS arm64
            os: macos-15
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked -p onseiman-server -p onseiman-app

      - name: Package artifacts & SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/onseiman-server${{ matrix.ext }}" "dist/onseiman-server-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/release/onseiman${{ matrix.ext }}" "dist/onseiman-${{ matrix.suffix }}${{ matrix.ext }}"
          if [ "${{ matrix.suffix }}" = "windows-x64" ]; then
            mkdir -p stage_win
            cp "target/release/onseiman.exe" stage_win/onseiman.exe
            cp "target/release/onseiman-server.exe" stage_win/onseiman-server.exe
            cp README.md LICENSE server_windows.bat stage_win/
            powershell -NoProfile -Command "Compress-Archive -Path stage_win\* -DestinationPath dist\OnseiMan-windows-x64.zip -Force"
          else
            mkdir -p stage_mac/server stage_mac/packaging/mac
            cp "target/release/onseiman-server" stage_mac/onseiman-server
            cp server_mac.command server_mac_remove.command LICENSE stage_mac/
            cp server/setup_macos.sh stage_mac/server/
            cp "packaging/mac/はじめに.md" stage_mac/packaging/mac/
            (cd stage_mac && zip -r ../dist/OnseiMan-macos-arm64.zip .)
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum * > "SHA256SUMS-${{ matrix.suffix }}.txt")
          else
            (cd dist && shasum -a 256 * > "SHA256SUMS-${{ matrix.suffix }}.txt")
          fi
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onseiman-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error
