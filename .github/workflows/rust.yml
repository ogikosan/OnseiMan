name: Rust CI & Build

on:
  push:
    branches: [feature/rust, develop, main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            suffix: windows-x64
            ext: .exe
          - name: macOS arm64
            os: macos-15
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p onseiman-server -p onseiman-app

      - name: Package artifacts & SHA-256
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/onseiman-server${{ matrix.ext }}" "dist/onseiman-server-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/release/onseiman${{ matrix.ext }}" "dist/onseiman-${{ matrix.suffix }}${{ matrix.ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum * > "SHA256SUMS-${{ matrix.suffix }}.txt")
          else
            (cd dist && shasum -a 256 * > "SHA256SUMS-${{ matrix.suffix }}.txt")
          fi
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onseiman-${{ matrix.suffix }}
          path: dist/
          if-no-files-found: error
