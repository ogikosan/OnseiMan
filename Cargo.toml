# OnseiMan Rust ワークスペース
[workspace]
resolver = "2"
members = ["crates/onseiman-core", "crates/onseiman-speech", "crates/onseiman-server", "crates/onseiman-platform", "crates/onseiman-app"]

[workspace.package]
version = "2.0.11"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ogikosan/OnseiMan"

[workspace.dependencies]
# preserve_order: 辞書の言葉の並びを、預かったときのまま保つ
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
